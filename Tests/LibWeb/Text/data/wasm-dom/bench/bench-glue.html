const heap = [null];
function toHandle(obj) { heap.push(obj); return heap.length - 1; }
const decoder = new TextDecoder();
const encoder = new TextEncoder();
let memory;
const mem = () => new Uint8Array(memory.buffer);
const internedStrings = [];
// len === -1 means ptr is an interned-string id (matches the dom ABI sentinel).
const readStr = (p, l) => l === -1 ? internedStrings[p] : decoder.decode(mem().subarray(p, p + l));
function writeStr(value, dst, cap) {
    const bytes = encoder.encode(value);
    mem().set(bytes.subarray(0, Math.min(bytes.length, cap)), dst);
    return bytes.length;
}

const glue = {
    get_element_by_id: (p, l) => { const e = document.getElementById(readStr(p, l)); return e ? toHandle(e) : 0; },
    create_element: (p, l) => toHandle(document.createElement(readStr(p, l))),
    append_child: (a, b) => { heap[a].appendChild(heap[b]); return 0; },
    set_attribute: (n, np, nl, vp, vl) => { heap[n].setAttribute(readStr(np, nl), readStr(vp, vl)); return 0; },
    get_attribute: (n, np, nl, dst, cap) => { const v = heap[n].getAttribute(readStr(np, nl)); return v === null ? -1 : writeStr(v, dst, cap); },
    text_content_set: (n, p, l) => { heap[n].textContent = readStr(p, l); return 0; },
    text_content_get: (n, dst, cap) => { const v = heap[n].textContent; return v === null ? -1 : writeStr(v, dst, cap); },
    release: (i) => { heap[i] = null; },
    intern: (p, l) => { internedStrings.push(readStr(p, l)); return internedStrings.length - 1; },
    now: () => performance.now(),
};

const module = new WebAssembly.Module(bytes);
const instance = new WebAssembly.Instance(module, { glue });
memory = instance.exports.memory;
instance.exports._start();
