<!DOCTYPE html>
<!-- Event dispatch benchmark, JS-listener variant. Same driver as events-dom. -->
<body>
<button id="btn"></button>
<ol id="results"></ol>
<script>
    let counter = 0;
    document.getElementById("btn").addEventListener("click", () => { counter++; });
</script>
<script>
    const btn = document.getElementById("btn");
    const results = document.getElementById("results");
    for (let rep = 0; rep < 5; rep++) {
        const start = performance.now();
        for (let i = 0; i < 5000; i++)
            btn.dispatchEvent(new Event("click"));
        const li = document.createElement("li");
        li.textContent = `dispatch ${(performance.now() - start).toFixed(2)} ms`;
        results.appendChild(li);
    }
    results.setAttribute("data-done", "yes");
</script>
