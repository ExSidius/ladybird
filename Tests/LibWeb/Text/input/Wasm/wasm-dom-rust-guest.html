<div id="root"></div>

<script src="../include.js"></script>
<script>
    // The module was written in Rust (guests/rust/) — it builds the UI inside
    // #root and counts clicks with the formatting done in Rust.

        println("first: " + items[0].textContent);
        println("last: " + items[2].textContent);
    });
</script>
